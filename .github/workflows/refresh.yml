# Publish the fixed 2024 demonstration on demand; it is not a live weekly feed.
name: publish-demo
on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild the fixed 2024 season before publishing
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: inputs.rebuild
      - uses: actions/cache@v4
        if: inputs.rebuild
        with:
          path: data
          key: paraliwatch-data-${{ runner.os }}-${{ hashFiles('uv.lock', 'config/punjab_2024.yaml', 'src/paraliwatch/ard.py') }}-${{ github.run_id }}
          restore-keys: |
            paraliwatch-data-${{ runner.os }}-${{ hashFiles('uv.lock', 'config/punjab_2024.yaml', 'src/paraliwatch/ard.py') }}-
      - run: make run
        if: inputs.rebuild
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
