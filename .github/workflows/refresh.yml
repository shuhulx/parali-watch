# Weekly now-cast refresh during the burning season (Mon 02:30 UTC = 08:00 IST).
# The data/ cache (STAC catalogue + ARD) is restored between runs, so each run only
# ingests scenes the catalogue has not seen, then republishes site/ to GitHub Pages.
name: weekly-refresh
on:
  schedule:
    - cron: "30 2 * 10,11 1"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: data
          key: paraliwatch-data-${{ github.run_id }}
          restore-keys: paraliwatch-data-
      - run: uv sync --frozen
      - run: uv run paraliwatch run -c config/punjab_2024.yaml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
