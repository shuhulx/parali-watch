[project]
name = "paraliwatch"
version = "0.1.0"
description = "Weekly burn-scar mapping for Punjab using MODIS and Sentinel-2"
readme = "README.md"
authors = [
    { name = "Shuhul Razdan", email = "shuhul.aiml@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "geopandas>=1.2.0",
    "h3>=4.5.0",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "odc-stac>=0.5.3",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "planetary-computer>=1.0.0",
    "pyarrow>=26.0.0",
    "pyproj>=3.8.0",
    "pystac>=1.15.2",
    "pystac-client>=0.9.1",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "rioxarray>=0.23.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "typer>=0.27.3",
    "xarray>=2026.9.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[project.scripts]
paraliwatch = "paraliwatch.cli:app"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B905"]
